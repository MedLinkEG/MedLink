name: Spring Boot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medlink
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/medlink
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Recreate clean test database
        run: |
          set -euo pipefail

          DB_CONTAINER=$(docker ps -q --filter "ancestor=postgres:17-alpine" | head -n 1)

          if [ -z "$DB_CONTAINER" ]; then
            echo "PostgreSQL container not found"
            exit 1
          fi

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS medlink WITH (FORCE);"

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres \
            -c "CREATE DATABASE medlink WITH TEMPLATE template0;"

      - name: Build and run tests
        working-directory: backend/core-api
        run: mvn --batch-mode --no-transfer-progress clean verify