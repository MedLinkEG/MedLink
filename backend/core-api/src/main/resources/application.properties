spring.application.name=core-api

# Database
# Values are injected via environment variables (see .env.example at repo root).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medlink}
spring.datasource.username=${DB_USER:medlink}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mailjet SMTP
spring.mail.host=${MAILJET_SMTP_HOST}
spring.mail.port=${MAILJET_SMTP_PORT:587}
spring.mail.username=${MAILJET_SMTP_USERNAME}
spring.mail.password=${MAILJET_SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# MedLink
app.mail.from=${MAILJET_FROM_EMAIL}
app.mail.sender-name=MedLink

# OTP
app.otp.hmac-secret=${OTP_HMAC_SECRET}