spring.application.name=core-api

# Database
# Values are injected via environment variables (see .env.example at repo root).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medlink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medlink}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}